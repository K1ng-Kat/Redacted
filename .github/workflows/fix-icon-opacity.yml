name: Fix REDACTED Full-Size App Icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-icon-opacity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-icon:
    if: github.repository == 'K1ng-Kat/Redacted'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history to access the original icon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image dependency
        run: python3 -m pip install --quiet pillow

      - name: Correct original app icon scale and transparent padding
        run: python3 Scripts/fix_icon_opacity.py

      - name: Commit full-size opaque icon to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Redacted/Assets.xcassets/AppIcon.appiconset/Redacted Files App Icon (1024).png"
          if git diff --cached --quiet; then
            echo "Corrected icon already present."
          else
            git commit -m "Fix full-size app icon without white inset border"
            git push origin HEAD:main
          fi
