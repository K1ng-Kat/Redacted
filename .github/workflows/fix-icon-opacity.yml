name: Remove REDACTED App Icon White Border
# Supports near-opaque PNG interiors exported with alpha 254.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-icon-opacity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-icon-opaque:
    if: github.repository == 'K1ng-Kat/Redacted'
    runs-on: ubuntu-latest
    steps:
      - name: Check out REDACTED
        uses: actions/checkout@v4
      - name: Install image processing dependency
        run: python3 -m pip install --quiet pillow
      - name: Preserve icon artwork and replace transparent rim
        run: python3 Scripts/fix_icon_opacity.py
      - name: Commit corrected original icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Redacted/Assets.xcassets/AppIcon.appiconset/Redacted Files App Icon (1024).png"
          if git diff --cached --quiet; then
            echo "App icon already opaque. No binary change."
          else
            git commit -m "Remove app icon white rim by making transparent edges opaque"
            git push origin HEAD:main
          fi
