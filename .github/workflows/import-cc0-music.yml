name: Import CC0 Game Music

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-cc0-music.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-licensed-audio:
    if: github.repository == 'K1ng-Kat/Redacted'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Redacted
        uses: actions/checkout@v4

      - name: Confirm dependencies
        run: |
          python3 --version
          ffmpeg -version | head -n 1

      - name: Download and convert CC0 tracks
        run: python3 Scripts/import_cc0_music.py

      - name: Push audio resources into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Redacted/Audio/MenuBossa.m4a Redacted/Audio/LevelShop.m4a
          if git diff --cached --quiet; then
            echo "CC0 tracks already present."
          else
            git commit -m "Bundle CC0 menu and in-level music"
            git push origin HEAD:main
          fi
