name: Validate REDACTED iPhone and iPad Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-apple-build.yml"
      - "Redacted/**/*.swift"
      - "Redacted/**/*.storyboard"
      - "Redacted/*.swift"
      - "Redacted.xcodeproj/project.pbxproj"
      - "Redacted-Info.plist"
      - "SEASONS_AND_UI_OVERHAUL.md"
      - "Scripts/validate_cosmetics.py"
      - "Scripts/validate_release_navigation.py"
      - "Backend/**/*.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 22
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate cosmetic catalog and duel emote coverage
        run: |
          python3 Scripts/validate_cosmetics.py
      - name: Validate original navigation, live character and offline startup
        run: |
          python3 Scripts/validate_release_navigation.py
      - name: Build universal game for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Redacted.xcodeproj \
            -scheme Redacted \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/RedactedDerived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/redacted-build.log"

      - name: Build release configuration for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Redacted.xcodeproj \
            -scheme Redacted \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/RedactedDerived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/redacted-release-build.log"

      - name: Check release bundle has no developer preview UI
        run: |
          APP="$RUNNER_TEMP/RedactedDerived/Build/Products/Release-iphonesimulator/Redacted.app"
          test -d "$APP"
          ! grep -R -a -q "DEVELOPER PREVIEW" "$APP" || exit 1
          ! grep -R -a -q "DEVELOPER TOOLS" "$APP" || exit 1

      - name: Check Game Mode support and native launch screen
        run: |
          APP="$RUNNER_TEMP/RedactedDerived/Build/Products/Debug-iphonesimulator/Redacted.app"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsGameMode" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSSupportsGameMode' "$APP/Info.plist")" = "true" ||
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSSupportsGameMode' "$APP/Info.plist")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$APP/Info.plist")" = "LaunchScreen"
