<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDACTED ID Verification</title></head>
<body style="margin:0;background:#0d1428;color:#f7f2e0;font-family:Arial,Helvetica,sans-serif;padding:32px 16px">
  <div style="max-width:480px;margin:auto;background:#1b2f4b;border:2px solid #40aaca;border-radius:16px;padding:30px">
    <div style="font-weight:900;letter-spacing:4px;font-size:25px">REDACTED</div>
    <p style="font-size:13px;letter-spacing:2px;color:#51d5e6">DETECTIVE AGENCY · ACCOUNT ACCESS</p>
    <h1 style="font-size:23px;margin:32px 0 14px">Your verification code</h1>
    <p style="line-height:1.5;color:#d4e1ed">Enter this one-time code in REDACTED to sign in or recover your account.</p>
    <div style="text-align:center;background:#0d1428;padding:22px 12px;border-radius:12px;border:1px solid #d1a62b;font-size:37px;letter-spacing:8px;font-weight:900;color:#ffd34a">{{ .Token }}</div>
    <p style="font-size:13px;line-height:1.7;color:#d4e1ed">Never share this code. REDACTED staff will never ask for it. If you didn't request it, ignore this email.</p>
    <p style="font-size:11px;color:#819bb8">© REDACTED DETECTIVE AGENCY</p>
  </div>
</body></html>
